      </table>

      <div class="form-grid" style="margin-top:14px; grid-template-columns:1fr 1fr 1.4fr auto;">
        <div class="field"><label>Fecha</label><input type="date" id="loan-fecha"></div>
        <div class="field"><label>Valor abonado</label><input type="number" id="loan-valor" placeholder="0" min="0"></div>
        <div class="field"><label>Observaciones</label><input type="text" id="loan-obs" placeholder="Opcional"></div>
        <div style="align-self:end;"><button class="btn-add" id="addLoanPagoBtn">Agregar abono</button></div>
      </div>
    </div>

    <div class="section-title">Trámites y matrículas del carro</div>
    <p style="color:var(--ink-soft); font-size:13px; margin-bottom:16px;">SOAT, revisión técnico-mecánica, impuesto vehicular... cada uno con su fecha y un botón para ir directo a pagarlo.</p>

    ${sorted.length ? sorted.map(t=>{
      const diff = tramiteDiffDays(t);
      const urg = tramiteUrgency(diff);
      return `
      <div class="tramite-card">
        <div class="tramite-top">
          <div class="tramite-name">${t.nombre}</div>
          <span class="tramite-badge ${urg}">${tramiteWhenLabel(diff)}</span>
        </div>
        <div class="tramite-meta">${fmt(t.monto)} · vence el ${t.fecha}${t.categoria ? ' · '+t.categoria : ''}</div>
        <div class="tramite-actions">
          ${t.link ? `<a class="tramite-link-btn" href="${t.link}" target="_blank" rel="noopener">Pagar ahora →</a>` : `<span style="font-size:12px; color:var(--ink-soft);">Sin link guardado</span>`}

          <button class="goal-del" data-tramite-del="${t.id}">Eliminar</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty-note" style="background:var(--card); border:1px solid var(--line); border-radius:10px;">Aún no tienes trámites registrados. Agrega el primero abajo ↓</div>`}

    </div>
  `;

  document.getElementById('loan-total').addEventListener('change', (e)=>{
    const val = parseFloat(e.target.value) || 0;
    state.prestamoCarro.total = val;
    saveState();
    renderCarro();
    showToast('Deuda total actualizada ✓');
  });

  document.getElementById('addLoanPagoBtn').onclick = ()=>{
    const fecha = document.getElementById('loan-fecha').value;
    const valor = parseFloat(document.getElementById('loan-valor').value);
    const obs = document.getElementById('loan-obs').value.trim();
    if(!fecha){ showToast('Selecciona una fecha.'); return; }
    if(!valor || valor<=0){ showToast('Ingresa un valor válido.'); return; }
    state.prestamoCarro.pagos.push({ id:uid(), fecha, valor, obs });
    saveState();
    renderCarro();
    showToast('$ Abono registrado — vas reduciendo la deuda');
  };

  panel.querySelectorAll('[data-loanpago-del]').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('¿Eliminar este abono?')){
        state.prestamoCarro.pagos = state.prestamoCarro.pagos.filter(p=>p.id!==b.dataset.loanpagoDel);
        saveState();
        renderCarro();
      }
    };
  });

  document.getElementById('addTramiteBtn').onclick = ()=>{
    const nombre = document.getElementById('tr-nombre').value.trim();
    const monto = parseFloat(document.getElementById('tr-monto').value) || 0;
    const fecha = document.getElementById('tr-fecha').value;
    const categoria = document.getElementById('tr-categoria').value;
    let link = document.getElementById('tr-link').value.trim();
    if(!nombre){ showToast('Ponle un nombre al trámite.'); return; }
    if(!fecha){ showToast('Selecciona la fecha de vencimiento.'); return; }
    if(link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
    state.tramites.push({ id:uid(), nombre, monto, fecha, link, categoria });
    saveState();
    renderCarro();
    showToast('Trámite agregado ✓');
  };

  panel.querySelectorAll('[data-tramite-paid]').forEach(b=>{
    b.onclick = ()=>{
      const t = state.tramites.find(x=>x.id===b.dataset.tramitePaid);
      if(!t) return;
      state.transactions.push({ id:uid(), fecha:new Date().toISOString().slice(0,10), tipo:'Egreso', categoria:t.categoria||'Carro', concepto:t.nombre, monto:t.monto });
      const d = new Date(t.fecha+'T00:00:00');
      d.setFullYear(d.getFullYear()+1);
      t.fecha = d.toISOString().slice(0,10);
      saveState();
      renderCarro();
      showToast(`$ ${t.nombre} pagado — renovado para ${t.fecha}`);
    };
  });

  panel.querySelectorAll('[data-tramite-del]').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('¿Eliminar este trámite?')){
        state.tramites = state.tramites.filter(t=>t.id!==b.dataset.tramiteDel);
        saveState();
        renderCarro();
      }
    };
  });
}

      }catch(err){
        console.error(err);
        statusEl.textContent = 'No pude leer ese archivo. ¿Es un .xlsx válido?';
      }
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});

  };

  document.getElementById('restoreInput').addEventListener('change', (e)=>{

    if(!confirm('Esto reemplazará tus datos actuales con los del respaldo. ¿Continuar?')) { e.target.value=''; return; }

      try{

        saveState();

        showToast('$ Datos restaurados');
        render();
      }catch(err){
        showToast('Ese archivo no es un respaldo válido.');
      }
    };
    reader.readAsText(file);
  });
}

// Busca dentro de un workbook exportado desde Excel la tabla de registros con
// columnas Fecha / Tipo / Categoria / Concepto / Monto, sin importar en qué
// hoja u offset de columna esté (soporta el formato típico de "Dashboard" con
// varias tablas sueltas en la misma hoja).
function extractTransactionsFromWorkbook(wb){
  const results = [];
  wb.SheetNames.forEach(sheetName=>{
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
    for(let r=0; r<rows.length; r++){
      const row = rows[r];
      if(!row) continue;
      const idxFecha = row.findIndex(c=> String(c).trim().toLowerCase()==='fecha');
      const idxTipo = row.findIndex(c=> String(c).trim().toLowerCase()==='tipo');
      const idxCat = row.findIndex(c=> String(c).trim().toLowerCase().startsWith('categoria'));
      const idxMonto = row.findIndex(c=> String(c).trim().toLowerCase()==='monto');
      if(idxFecha===-1 || idxTipo===-1 || idxCat===-1 || idxMonto===-1) continue;
      const idxConcepto = row.findIndex(c=> String(c).trim().toLowerCase()==='concepto');
      // Encontramos el encabezado; leemos filas siguientes hasta que la fecha deje de tener sentido
      for(let d=r+1; d<rows.length; d++){
        const drow = rows[d];
        if(!drow) continue;
        const rawFecha = drow[idxFecha];
        const rawTipo = drow[idxTipo];
        const rawMonto = drow[idxMonto];
        if(rawFecha==null || rawTipo==null || rawMonto==null) continue;
        let fecha = null;
        if(rawFecha instanceof Date){
          fecha = rawFecha.toISOString().slice(0,10);
        } else if(typeof rawFecha === 'number'){
          const d2 = XLSX.SSF.parse_date_code(rawFecha);
          if(d2) fecha = `${d2.y}-${String(d2.m).padStart(2,'0')}-${String(d2.d).padStart(2,'0')}`;
        } else if(typeof rawFecha === 'string' && /^\d{4}-\d{2}-\d{2}/.test(rawFecha)){
          fecha = rawFecha.slice(0,10);
        }
        const tipoStr = String(rawTipo).trim();
        if(!fecha || (tipoStr!=='Ingreso' && tipoStr!=='Egreso')) continue;
        const monto = parseFloat(rawMonto);
        if(!monto || monto<=0) continue;
        results.push({
          id: uid(),
          fecha,
          tipo: tipoStr,
          categoria: (drow[idxCat]!=null && String(drow[idxCat]).trim()) || 'Otros',
          concepto: idxConcepto>-1 && drow[idxConcepto]!=null ? String(drow[idxConcepto]).trim() : '',
          monto
        });
      }
    }
  });
  return results;
}

  document.getElementById('authSwitchBtn').onclick = ()=> renderAuthScreen(mode==='signup' ? 'login' : 'signup');

  document.getElementById('authSubmitBtn').onclick = async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.textContent = '';
    if(!email || !pass){ errEl.textContent = 'Completa correo y contraseña.'; return; }
    try{
      if(mode==='signup'){
        await fbAuth.createUserWithEmailAndPassword(email, pass);
      } else {
        await fbAuth.signInWithEmailAndPassword(email, pass);
      }
      // onAuthStateChanged se encarga de continuar (cargar datos y mostrar la app)
    }catch(e){
      errEl.textContent = traducirErrorFirebase(e);
    }
  };

  if(mode==='login'){
    document.getElementById('authForgotBtn').onclick = async ()=>{
      const email = document.getElementById('authEmail').value.trim();
      if(!email){ document.getElementById('authError').textContent = 'Escribe tu correo arriba primero.'; return; }
      try{
        await fbAuth.sendPasswordResetEmail(email);
        showToast('$ Te enviamos un correo para restablecer tu contraseña');
      }catch(e){
        document.getElementById('authError').textContent = traducirErrorFirebase(e);
      }
    };
  }
}

function traducirErrorFirebase(e){
  const code = e && e.code || '';
  const map = {
    'auth/invalid-email': 'Ese correo no parece válido.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese correo — intenta iniciar sesión.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/network-request-failed': 'Sin conexión a internet. Revisa tu red e intenta de nuevo.'
  };
  return map[code] || 'Ocurrió un error. Intenta de nuevo.';
}

/* ---------------- Init ---------------- */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.protocol==='http:')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{ /* no disponible, ej. archivo local */ });
  });
}

if(fbAuth){
  fbAuth.onAuthStateChanged((user)=>{
    currentUser = user;
    if(user){
      loadState();
    } else {
      renderAuthScreen('login');
    }
  });
} else {
  // Firebase no disponible (ej. sin internet en la primera carga): seguimos en modo local
  loadState();
}
</script>

</html>
