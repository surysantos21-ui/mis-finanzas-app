<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis Finanzas $ Libro de Abundancia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#B23A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#FDF3F7;
    --paper-dark:#FBE5EE;
    --card:#FFFFFF;
    --ink:#5C3A4E;
    --ink-soft:#A4809A;
    --line:#F4D9E6;
    --income:#B23A6B;
    --income-soft:#FBE1EC;
    --expense:#E0876A;
    --expense-soft:#FCEBE3;
    --savings:#C79A3D;
    --savings-soft:#FBF1D9;
    --accent:#D46A94;
    --lavender:#C9A6D6;
    --shadow: 0 1px 2px rgba(178,58,107,0.07), 0 6px 18px rgba(178,58,107,0.08);
  }
  body.dark{
    --paper:#2A1E27;
    --paper-dark:#3A2A35;
    --card:#33242F;
    --ink:#F3E3ED;
    --ink-soft:#C7A7BC;
    --line:#4E3A48;
    --income:#E8709E;
    --income-soft:#4A2C3C;
    --expense:#F0A183;
    --expense-soft:#4A3128;
    --savings:#E0BB63;
    --savings-soft:#493A22;
    --accent:#E893BB;
    --lavender:#D9BCE5;
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.3);
  }
  body.dark{
    background:
      radial-gradient(circle at 8% 4%, #3A2A35 0%, transparent 40%),
      radial-gradient(circle at 96% 8%, #34263C 0%, transparent 38%),
      var(--paper);
  }

  /* Paleta Tierra: tonos cálidos y neutros (verde salvia, terracota, arena) */
  body.theme-tierra{
    --paper:#F5F1E6;
    --paper-dark:#EAE1C9;
    --card:#FFFFFF;
    --ink:#3B3226;
    --ink-soft:#8A7F68;
    --line:#DDD1B0;
    --income:#4C7A5E;
    --income-soft:#E0EAE1;
    --expense:#B0623A;
    --expense-soft:#F2E2D4;
    --savings:#A98A3E;
    --savings-soft:#F0E5C6;
    --accent:#6B5A3E;
    --lavender:#9C8F6E;
    --shadow: 0 1px 2px rgba(59,50,38,0.08), 0 6px 18px rgba(59,50,38,0.08);
  }
  body.theme-tierra{
    background:
      radial-gradient(circle at 8% 4%, #EAE1C9 0%, transparent 40%),
      radial-gradient(circle at 96% 8%, #E3E8D6 0%, transparent 38%),
      #F5F1E6;
  }
  body.theme-tierra.dark{
    --paper:#211D16;
    --paper-dark:#2C2820;
    --card:#282419;
    --ink:#EDE6D4;
    --ink-soft:#B7AB8E;
    --line:#433C2E;
    --income:#7FB899;
    --income-soft:#2E3E2C;
    --expense:#D98F63;
    --expense-soft:#3C2A1E;
    --savings:#D8B95F;
    --savings-soft:#392F19;
    --accent:#C7A876;
    --lavender:#B8A87E;
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.3);
  }
  body.theme-tierra.dark{
    background:
      radial-gradient(circle at 8% 4%, #2C2820 0%, transparent 40%),
      radial-gradient(circle at 96% 8%, #2A2418 0%, transparent 38%),
      var(--paper);
  }

  /* Paleta Océano: azul marino y gris, look más clásico */
  body.theme-oceano{
    --paper:#EFF3F6;
    --paper-dark:#DFE7ED;
    --card:#FFFFFF;
    --ink:#1E2A38;
    --ink-soft:#5E7085;
    --line:#C9D6E1;
    --income:#2C6E8C;
    --income-soft:#DCEAF0;
    --expense:#B5533F;
    --expense-soft:#F2E0DA;
    --savings:#B08A3E;
    --savings-soft:#F0E6CC;
    --accent:#33566E;
    --lavender:#7B93A8;
    --shadow: 0 1px 2px rgba(30,42,56,0.07), 0 6px 18px rgba(30,42,56,0.08);
  }
  body.theme-oceano{
    background:
      radial-gradient(circle at 8% 4%, #DFE7ED 0%, transparent 40%),
      radial-gradient(circle at 96% 8%, #E3E9EE 0%, transparent 38%),
      #EFF3F6;
  }
  body.theme-oceano.dark{
    --paper:#111A22;
    --paper-dark:#1A2530;
    --card:#18222C;
    --ink:#DCE6EE;
    --ink-soft:#8FA3B5;
    --line:#324150;
    --income:#5FA7C4;
    --income-soft:#1E323C;
    --expense:#DB8F78;
    --expense-soft:#3A2A21;
    --savings:#E0C177;
    --savings-soft:#39301C;
    --accent:#6E97AE;
    --lavender:#8FA9BE;
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.3);
  }
  body.theme-oceano.dark{
    background:
      radial-gradient(circle at 8% 4%, #1A2530 0%, transparent 40%),
      radial-gradient(circle at 96% 8%, #182430 0%, transparent 38%),
      var(--paper);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 4%, #FBE5EE 0%, transparent 40%),
      radial-gradient(circle at 96% 8%, #F3E3F5 0%, transparent 38%),
      var(--paper);
    color:var(--ink);
    font-family:'Poppins', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:1100px; margin:0 auto; padding:28px 20px 80px; }

  /* Header */
  .ledger-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px; margin-bottom:6px;
    flex-wrap:wrap; gap:14px;
  }
  .ledger-title{
    font-family:'Playfair Display', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:34px;
    letter-spacing:-0.01em;
  }
  .ledger-title .accent-dot{ color:var(--savings); }
  .ledger-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; letter-spacing:0.03em; text-transform:uppercase; }

  .month-picker{ display:flex; align-items:center; gap:10px; }
  .month-picker button{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); cursor:pointer; font-size:15px; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    transition: all .15s ease;
  }
  .month-picker button:hover{ background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .theme-toggle{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; margin-left:4px;
  }
  .month-label{
    font-family:'Playfair Display', serif; font-weight:600; font-size:19px; min-width:170px; text-align:center;
    text-transform:capitalize;
  }

  /* Tabs */
  .tabs{ display:flex; gap:2px; margin:22px 0 22px; border-bottom:1px solid var(--line); }
  .tab-btn{
    font-family:'Inter'; font-weight:600; font-size:13.5px; letter-spacing:0.02em;
    padding:10px 18px; background:none; border:none; cursor:pointer;
    color:var(--ink-soft); position:relative; top:1px;
  }
  .tab-btn.active{ color:var(--ink); border-bottom:2px solid var(--accent); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* Summary cards */
  .cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  @media(max-width:800px){ .cards{ grid-template-columns:repeat(2,1fr); } }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .card::after{
    content:''; position:absolute; top:-18px; right:-18px; width:56px; height:56px;
    border-radius:50%; background:var(--paper-dark); opacity:0.6; z-index:0;
  }
  .card .label, .card .value, .card .sub{ position:relative; z-index:1; }
  .card .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600; }
  .card .value{ font-family:'Space Mono', monospace; font-size:22px; font-weight:600; margin-top:6px; }
  .card.income .value{ color:var(--income); }
  .card.expense .value{ color:var(--expense); }
  .card.balance .value{ color:var(--ink); }
  .card.savings .value{ color:var(--savings); }
  .card .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }

  /* Section headers */
  .section-title{
    font-family:'Playfair Display', serif; font-weight:600; font-size:18px; margin:26px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title::before{ content:''; width:14px; height:2px; background:var(--accent); display:inline-block; }

  /* Chart grid */
  .chart-grid{ display:grid; grid-template-columns:1.2fr 1fr; gap:16px; }
  @media(max-width:800px){ .chart-grid{ grid-template-columns:1fr; } }
  .chart-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow); }
  .chart-card h4{ margin:0 0 10px; font-family:'Inter'; font-size:13px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
  .chart-wrap{ position:relative; height:230px; }
  .empty-note{ font-size:13px; color:var(--ink-soft); text-align:center; padding:40px 10px; }

  /* Form */
  .form-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:20px; box-shadow:var(--shadow); margin-bottom:22px;
  }
  .form-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; align-items:end; }
  @media(max-width:900px){ .form-grid{ grid-template-columns:repeat(2,1fr); } }
  .field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; margin-bottom:5px; }
  .field input, .field select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px;
    font-family:'Inter'; font-size:14px; background:var(--paper-dark); color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--accent); outline-offset:1px; background:#fff; }
  .type-toggle{ display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .type-toggle button{
    flex:1; padding:9px 6px; border:none; background:var(--paper-dark); cursor:pointer;
    font-weight:600; font-size:13px; color:var(--ink-soft);
  }
  .type-toggle button.active[data-t="Ingreso"]{ background:var(--income); color:#fff; }
  .type-toggle button.active[data-t="Egreso"]{ background:var(--expense); color:#fff; }
  .btn-add{
    background:linear-gradient(135deg, var(--income), var(--accent));
    color:#fff; border:none; border-radius:20px;
    padding:10px 18px; font-weight:600; cursor:pointer; font-size:13.5px;
    transition:opacity .15s, transform .15s;
    box-shadow:0 3px 10px rgba(178,58,107,0.25);
  }
  .btn-add:hover{ opacity:0.92; transform:translateY(-1px); }

  /* Ledger table */
  .ledger-table{ width:100%; border-collapse:collapse; background:var(--card); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--line); }
  .ledger-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-soft); padding:10px 12px; border-bottom:1px solid var(--line); background:var(--paper-dark);
  }
  .ledger-table td{ padding:10px 12px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .ledger-table tr:last-child td{ border-bottom:none; }
  .ledger-table tr:hover td{ background:#FBFAF6; }
  .amount-mono{ font-family:'Space Mono', monospace; font-weight:600; text-align:right; }
  .flourish{ text-align:center; color:var(--lavender); font-size:13px; letter-spacing:0.3em; margin:2px 0 18px; user-select:none; }

  /* Wisdom card */
  .wisdom-card{
    background:linear-gradient(135deg, #FFFFFF 0%, var(--savings-soft) 120%);
    border:1px solid var(--line); border-radius:20px; padding:22px 26px;
    box-shadow:var(--shadow); margin-bottom:24px; position:relative; overflow:hidden;
  }
  .wisdom-card::before{
    content:'❁'; position:absolute; top:14px; right:20px; font-size:28px; color:var(--savings-soft); z-index:0;
  }
  .wisdom-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--savings); font-weight:700; margin-bottom:8px; position:relative; z-index:1; }
  .wisdom-text{ font-family:'Playfair Display', serif; font-style:italic; font-size:18px; line-height:1.5; color:var(--ink); position:relative; z-index:1; max-width:640px; }
  .wisdom-refresh{
    margin-top:12px; background:none; border:none; color:var(--income); font-weight:600; font-size:12.5px;
    cursor:pointer; text-decoration:underline; position:relative; z-index:1; padding:0;
  }

  .tag{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .tag.Ingreso{ background:var(--income-soft); color:var(--income); }
  .tag.Egreso{ background:var(--expense-soft); color:var(--expense); }

  /* Insights row */
  .insights{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:14px; margin-bottom:24px; }
  @media(max-width:800px){ .insights{ grid-template-columns:1fr; } }
  .insight-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px 18px; box-shadow:var(--shadow); }
  .insight-card .itl{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:700; margin-bottom:6px; }
  .insight-card .ival{ font-size:14px; line-height:1.45; }
  .delta-up{ color:var(--expense); font-weight:700; }
  .delta-down{ color:var(--income); font-weight:700; }

  /* Calendar heatmap */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-day{
    aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-family:'Space Mono', monospace; color:var(--ink-soft); background:var(--paper-dark);
    border:1px solid var(--line); cursor:pointer; transition:transform .1s ease;
  }
  .cal-day:hover{ transform:scale(1.08); }
  .cal-day.has-spend{ color:#fff; border-color:transparent; }
  .cal-day.empty{ visibility:hidden; cursor:default; }
  .cal-day.empty:hover{ transform:none; }

  /* Day detail modal */
  .day-modal-overlay{
    position:fixed; inset:0; background:rgba(92,58,78,0.55); z-index:9998;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .day-modal-card{
    background:var(--paper); border-radius:22px; max-width:420px; width:100%; padding:26px 28px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:85vh; overflow-y:auto;
  }
  .day-modal-close{ float:right; background:none; border:none; font-size:18px; color:var(--ink-soft); cursor:pointer; }
  .day-modal-date{ font-family:'Playfair Display', serif; font-size:19px; font-weight:600; text-transform:capitalize; margin-bottom:4px; }
  .day-modal-totals{ display:flex; gap:18px; margin:14px 0 18px; }
  .day-modal-totals div{ flex:1; }
  .day-modal-totals .dm-label{ font-size:11px; text-transform:uppercase; color:var(--ink-soft); font-weight:700; }
  .day-modal-totals .dm-val{ font-family:'Space Mono', monospace; font-size:18px; font-weight:700; }
  .day-modal-list{ border-top:1px solid var(--line); padding-top:10px; }
  .day-modal-row{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid var(--line); }
  .day-modal-row:last-child{ border-bottom:none; }

  /* Cierre de mes */
  .cierre-btn{
    background:linear-gradient(135deg, var(--ink), var(--accent)); color:#fff; border:none;
    border-radius:20px; padding:9px 18px; font-weight:600; font-size:12.5px; cursor:pointer;
  }
  .cierre-progress{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; }
  .cierre-step{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .cierre-step.done{ border-color:var(--income); background:var(--income-soft); }
  .cierre-step-top{ display:flex; gap:10px; align-items:flex-start; }
  .cierre-step-top input[type="checkbox"]{ margin-top:3px; width:18px; height:18px; accent-color:var(--income); flex-shrink:0; }
  .cierre-step-title{ font-weight:600; font-size:13.5px; }
  .cierre-step-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .cierre-step-data{ margin-top:8px; font-family:'Space Mono', monospace; font-size:12.5px; background:var(--paper-dark); border-radius:8px; padding:8px 10px; }
  .cierre-diff-ok{ color:var(--income); font-weight:700; }
  .cierre-diff-bad{ color:var(--expense); font-weight:700; }
  .cal-legend{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft); margin-top:10px; justify-content:flex-end; }
  .cal-legend .sw{ width:12px; height:12px; border-radius:3px; }

  /* Monthly note */
  .note-area{
    width:100%; min-height:80px; border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    font-family:'Poppins'; font-size:13.5px; background:var(--paper-dark); color:var(--ink); resize:vertical;
  }
  .note-area:focus{ outline:2px solid var(--accent); background:#fff; }

  /* Streaks & achievements */
  .streak-badge{ font-size:11.5px; font-weight:700; color:var(--savings); white-space:nowrap; }
  .achieve-banner{
    background:linear-gradient(135deg, var(--savings-soft), var(--income-soft));
    border-radius:16px; padding:14px 18px; margin-bottom:18px; font-size:13.5px; font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  .goal-card.done{ border-color:var(--savings); }
  .goal-badge{ font-size:11px; font-weight:700; color:var(--savings); background:var(--savings-soft); padding:3px 10px; border-radius:20px; margin-left:8px; }

  /* Search/filter bar */
  .filter-bar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-bar input, .filter-bar select{
    padding:8px 12px; border:1px solid var(--line); border-radius:20px; background:var(--card);
    font-family:'Poppins'; font-size:13px; color:var(--ink);
  }
  .filter-bar input{ flex:1; min-width:160px; }

  /* Recurring */
  .recur-row{ display:grid; grid-template-columns:0.8fr 1fr 1.3fr 0.9fr 0.8fr auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .recur-row:last-child{ border-bottom:none; }
  .recur-apply-btn{ margin:10px 0 22px; }

  /* Settings blocks */
  .settings-block{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow); margin-bottom:20px; }
  .settings-block h4{ font-family:'Playfair Display', serif; font-size:16px; margin:0 0 6px; }
  .settings-block p{ font-size:13px; color:var(--ink-soft); margin:0 0 12px; line-height:1.5; }
  .settings-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .file-label{
    display:inline-block; padding:9px 16px; border-radius:20px; border:1px dashed var(--accent);
    color:var(--accent); font-size:13px; font-weight:600; cursor:pointer;
  }
  .file-label input{ display:none; }
  .toggle-row{ display:flex; align-items:center; gap:10px; }
  .switch{ position:relative; width:44px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:var(--line); border-radius:20px; cursor:pointer; transition:.2s; }
  .slider::before{ content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider{ background:var(--accent); }
  .switch input:checked + .slider::before{ transform:translateX(20px); }

  /* Payment alerts */
  .alert-item{ display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-radius:14px; margin-bottom:8px; font-size:13.5px; gap:10px; }
  .alert-item .ai-left{ display:flex; flex-direction:column; gap:2px; }
  .alert-item .ai-when{ font-size:11.5px; opacity:0.85; }
  .alert-item.overdue{ background:var(--expense-soft); color:var(--expense); }
  .alert-item.soon{ background:var(--savings-soft); color:#8A6A1E; }
  .alert-item.later{ background:var(--paper-dark); color:var(--ink-soft); }
  .mark-paid-btn{ background:none; border:1px solid currentColor; border-radius:20px; padding:5px 12px; font-size:11.5px; cursor:pointer; color:inherit; font-weight:600; white-space:nowrap; }
  .no-alerts{ font-size:13px; color:var(--ink-soft); padding:6px 2px; }

  /* Credit card */
  .cc-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px; }
  .cc-top{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; }
  .cc-name{ font-family:'Playfair Display', serif; font-weight:600; font-size:18px; }
  .cc-balance{ font-family:'Space Mono', monospace; font-size:26px; font-weight:700; color:var(--expense); }
  .cc-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .cc-bar-wrap{ background:var(--paper-dark); border-radius:20px; height:10px; overflow:hidden; margin:14px 0 6px; }
  .cc-bar{ height:100%; border-radius:20px; background:var(--expense); transition:width .3s ease; }
  .cc-meta-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .cc-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .cc-mini-form{ display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-bottom:12px; }
  .cc-mov-row{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid var(--line); }
  .cc-mov-row:last-child{ border-bottom:none; }
  .cc-del{ background:none; border:none; color:var(--ink-soft); cursor:pointer; margin-left:8px; }

  /* Mi Carro - trámites */
  .tramite-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); margin-bottom:14px; }
  .tramite-top{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; }
  .tramite-name{ font-family:'Playfair Display', serif; font-size:16.5px; font-weight:600; }
  .tramite-badge{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .tramite-badge.overdue{ background:var(--expense-soft); color:var(--expense); }
  .tramite-badge.soon{ background:var(--savings-soft); color:#8A6A1E; }
  .tramite-badge.later{ background:var(--paper-dark); color:var(--ink-soft); }
  .tramite-meta{ font-size:12.5px; color:var(--ink-soft); margin:6px 0 12px; }
  .tramite-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .tramite-link-btn{
    background:var(--accent); color:#fff; border:none; border-radius:20px; padding:8px 16px;
    font-weight:600; font-size:12.5px; cursor:pointer; text-decoration:none; display:inline-block;
  }

  /* Préstamo del carro */
  .loan-card{
    background:linear-gradient(135deg, var(--paper-dark), var(--card));
    border:1px solid var(--line); border-radius:20px; padding:22px 24px; box-shadow:var(--shadow); margin-bottom:22px;
  }
  .loan-top{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:14px; }
  .loan-stat .ls-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:700; }
  .loan-stat .ls-val{ font-family:'Space Mono', monospace; font-size:20px; font-weight:700; }
  .loan-bar-wrap{ background:var(--card); border:1px solid var(--line); border-radius:20px; height:12px; overflow:hidden; margin-bottom:6px; }
  .loan-bar{ height:100%; background:var(--income); border-radius:20px; }
  .loan-pagos-table{ width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }
  .loan-pagos-table th{ text-align:left; font-size:11px; text-transform:uppercase; color:var(--ink-soft); padding:6px 8px; border-bottom:1px solid var(--line); }
  .loan-pagos-table td{ padding:7px 8px; border-bottom:1px solid var(--line); }

  /* Onboarding banner */
  .onboard-banner{
    background:linear-gradient(135deg, var(--income), var(--accent));
    border-radius:20px; padding:22px 26px; margin-bottom:22px; color:#fff;
    box-shadow:0 6px 20px rgba(178,58,107,0.28);
  }
  .onboard-banner h3{ font-family:'Playfair Display', serif; font-size:19px; margin:0 0 6px; }
  .onboard-banner p{ font-size:13.5px; margin:0 0 14px; opacity:0.95; line-height:1.5; }
  .onboard-banner button{
    background:#fff; color:var(--income); border:none; border-radius:20px; padding:10px 18px;
    font-weight:700; cursor:pointer; font-size:13.5px;
  }

  /* Comparativo anual */
  .year-picker{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .year-picker select{ padding:8px 14px; border:1px solid var(--line); border-radius:20px; background:var(--card); font-family:'Space Mono'; font-size:13.5px; color:var(--ink); }
  .compare-scroll{ overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); margin-bottom:26px; }
  .compare-table{ border-collapse:collapse; width:100%; font-size:12.5px; white-space:nowrap; }
  .compare-table th, .compare-table td{ padding:9px 12px; border-bottom:1px solid var(--line); text-align:right; }
  .compare-table th:first-child, .compare-table td:first-child{ text-align:left; position:sticky; left:0; background:var(--card); font-weight:600; }
  .compare-table thead th{ background:var(--paper-dark); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); font-weight:700; }
  .compare-table thead th:first-child{ background:var(--paper-dark); }
  .compare-table td.total-col, .compare-table th.total-col{ font-weight:700; background:var(--savings-soft); }
  .compare-table tr.total-row td{ font-weight:700; background:var(--paper-dark); border-top:2px solid var(--ink); }
  .compare-table td.amt-mono{ font-family:'Space Mono', monospace; }
  .compare-table td.zero{ color:var(--line); }

  .closing-card{
    background:linear-gradient(135deg, var(--income-soft), var(--savings-soft));
    border-radius:20px; padding:26px 28px; margin-bottom:10px;
  }
  .closing-title{ font-family:'Playfair Display', serif; font-style:italic; font-size:20px; margin-bottom:16px; }
  .closing-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  @media(max-width:800px){ .closing-grid{ grid-template-columns:repeat(2,1fr); } }
  .closing-item .cl-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:700; }
  .closing-item .cl-val{ font-family:'Space Mono', monospace; font-size:22px; font-weight:700; margin-top:4px; }

  /* Saldo real acumulado */
  .real-balance-card{
    background:linear-gradient(135deg, var(--ink), var(--accent));
    color:#fff; border-radius:20px; padding:20px 24px; margin-bottom:20px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  .real-balance-card .rb-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.85; font-weight:700; }
  .real-balance-card .rb-val{ font-family:'Space Mono', monospace; font-size:28px; font-weight:700; }
  .real-balance-card .rb-note{ font-size:11.5px; opacity:0.85; margin-top:2px; }
  .real-balance-card button{ background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.4); color:#fff; border-radius:20px; padding:8px 16px; font-size:12.5px; font-weight:600; cursor:pointer; }

  /* Category management */
  .cat-pills{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .cat-pill{
    display:flex; align-items:center; gap:6px; background:var(--paper-dark); border:1px solid var(--line);
    border-radius:20px; padding:6px 8px 6px 14px; font-size:13px; font-weight:600;
  }
  .cat-pill button{ background:var(--card); border:none; border-radius:50%; width:20px; height:20px; cursor:pointer; color:var(--ink-soft); font-size:11px; line-height:1; }
  .cat-pill button:hover{ background:var(--expense-soft); color:var(--expense); }
  .cat-add-row{ display:flex; gap:8px; }
  .cat-add-row input{ flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:20px; background:var(--paper-dark); font-family:'Poppins'; font-size:13.5px; }

  /* Toast with action button */
  .toast-action{ margin-left:10px; background:none; border:1px solid var(--paper); color:var(--paper); border-radius:14px; padding:3px 12px; cursor:pointer; font-size:12px; font-weight:700; }

  /* Lock screen */
  .lock-wrap{ max-width:340px; margin:90px auto; text-align:center; }
  .lock-input{
    text-align:center; font-size:24px; letter-spacing:10px; padding:14px; border-radius:14px;
    border:1px solid var(--line); width:100%; font-family:'Space Mono', monospace; background:var(--card);
  }
  .lock-input:focus{ outline:2px solid var(--accent); }
  .lock-error{ color:var(--expense); font-size:12.5px; margin-top:10px; min-height:16px; }

  /* Tutorial overlay */
  .tut-overlay{
    position:fixed; inset:0; background:rgba(92,58,78,0.55); z-index:9999;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .tut-card{
    background:var(--paper); border-radius:22px; max-width:480px; width:100%; padding:28px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:85vh; overflow-y:auto;
  }
  .tut-card h2{ font-family:'Playfair Display', serif; font-size:22px; margin:0 0 6px; }
  .tut-card .tut-sub{ color:var(--ink-soft); font-size:13px; margin-bottom:18px; }
  .tut-item{ display:flex; gap:12px; margin-bottom:14px; align-items:flex-start; }
  .tut-item .tut-emoji{ font-size:20px; }
  .tut-item .tut-txt strong{ display:block; font-size:13.5px; margin-bottom:2px; }
  .tut-item .tut-txt span{ font-size:12.5px; color:var(--ink-soft); line-height:1.4; }

  /* Ant-expense (hormiga) highlight */
  .ant-card{ background:linear-gradient(135deg, var(--paper-dark), var(--card)); }

  /* Ayuda / FAQ */
  .faq-item{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .faq-q{
    padding:14px 18px; cursor:pointer; font-weight:600; font-size:14px; display:flex;
    justify-content:space-between; align-items:center; user-select:none;
  }
  .faq-q:hover{ background:var(--paper-dark); }
  .faq-a{ padding:0 18px 16px; font-size:13.5px; color:var(--ink-soft); line-height:1.6; display:none; }
  .faq-item.open .faq-a{ display:block; }
  .faq-item.open .faq-arrow{ transform:rotate(180deg); }
  .faq-arrow{ transition:transform .2s ease; color:var(--accent); }
  .faq-cat{ font-family:'Playfair Display', serif; font-size:16px; margin:22px 0 10px; }
  .faq-cat:first-child{ margin-top:0; }

  /* Palette picker */
  .palette-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .palette-option{
    border:2px solid var(--line); border-radius:14px; padding:10px; cursor:pointer; width:110px; text-align:center;
    background:var(--card);
  }
  .palette-option.selected{ border-color:var(--accent); }
  .palette-swatch{ display:flex; height:28px; border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .palette-swatch span{ flex:1; }
  .palette-option .p-label{ font-size:12px; font-weight:600; }

  @media print{
    .tabs, .month-picker, .theme-toggle, .flourish, .btn-add, .wisdom-refresh, .del-btn,
    .mark-paid-btn, .file-label, .form-card, .onboard-banner, #toast, .cat-pills, .cat-add-row { display:none !important; }
    body{ background:#fff !important; }
  }

  /* Mobile responsiveness */
  @media(max-width:640px){
    .app{ padding:16px 12px 60px; }
    .ledger-title{ font-size:26px; }
    .ledger-head{ flex-direction:column; align-items:flex-start; }
    .tabs{ overflow-x:auto; white-space:nowrap; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; }
    .tab-btn{ padding:10px 12px; font-size:12.5px; flex:none; }
    .cards{ grid-template-columns:1fr 1fr; }
    .insights{ grid-template-columns:1fr; }
    .form-grid{ grid-template-columns:1fr; }
    .cc-mini-form{ grid-template-columns:1fr; }
    .recur-row{ grid-template-columns:1fr; gap:4px; text-align:left; }
    .closing-grid{ grid-template-columns:1fr 1fr; }
  }
  .del-btn{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; }
  .del-btn:hover{ color:var(--expense); }

  /* Budgets */
  .budget-row{
    display:grid; grid-template-columns:1.2fr 1fr 1fr 1fr; gap:12px; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .budget-row:last-child{ border-bottom:none; }
  .budget-cat{ font-weight:600; font-size:14px; }
  .budget-bar-wrap{ background:var(--paper-dark); border-radius:20px; height:8px; overflow:hidden; }
  .budget-bar{ height:100%; border-radius:20px; background:var(--income); transition:width .3s ease; }
  .budget-bar.over{ background:var(--expense); }
  .budget-input{ width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-family:'Space Mono'; font-size:13px; background:var(--paper-dark); }
  .budget-nums{ font-family:'Space Mono', monospace; font-size:12.5px; color:var(--ink-soft); }

  /* Goals */
  .goal-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:var(--shadow); margin-bottom:16px; }
  .goal-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .goal-name{ font-family:'Playfair Display', serif; font-weight:600; font-size:17px; }
  .goal-pct{ font-family:'Space Mono'; font-weight:600; color:var(--savings); }
  .goal-bar-wrap{ background:var(--paper-dark); border-radius:20px; height:12px; overflow:hidden; margin-bottom:8px; }
  .goal-bar{ height:100%; background:var(--savings); border-radius:20px; transition:width .4s ease; }
  .goal-nums{ display:flex; justify-content:space-between; font-family:'Space Mono'; font-size:13px; color:var(--ink-soft); }
  .goal-del{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; text-decoration:underline; }

  .add-goal-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .add-goal-form .field{ flex:1; min-width:140px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); padding:10px 20px; border-radius:8px;
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease;
    box-shadow:var(--shadow);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading{ text-align:center; padding:60px; color:var(--ink-soft); font-family:'Playfair Display', serif; font-size:16px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">$ Abriendo tu libro de abundancia…</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- State & storage ---------------- */
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DEFAULT_CATS = ["Sueldo","Otros","Servicios","Carro","Ahorro","Mati","Gustos","Gastos","Extras","Deudas","Deuda Carro"];

// Frases originales inspiradas en principios clásicos de educación financiera
// (ideas generales de obras como "El hombre más rico de Babilonia" y otros clásicos
// del ahorro y la libertad financiera), redactadas con voz propia.
const WISDOM = [
  "Guarda al menos una parte de todo lo que ganas, aunque sea pequeña. Un jardín crece de semillas, no de árboles ya hechos.",
  "No es cuánto ganas lo que te hace libre, es cuánto decides quedarte. Hoy es un buen día para apartar tu parte primero.",
  "El dinero que ahorras hoy es el que trabajará para ti mañana. Cada peso guardado es un pequeño empleado a tu servicio.",
  "Antes de pagar a los demás, págate a ti primero. Tu futuro también es una cuenta por pagar.",
  "Un presupuesto no es una jaula, es un mapa. Te muestra el camino más corto hacia lo que realmente quieres.",
  "La riqueza no llega de golpe, llega gota a gota, como se llena un pozo. Sé paciente contigo.",
  "Cuida lo que ya tienes antes de buscar más. Proteger tus ahorros es tan valioso como generarlos.",
  "Cada meta cumplida, por pequeña que sea, es prueba de que puedes confiar en ti con el dinero.",
  "Gastar con intención, no por costumbre: esa es la diferencia entre administrar tu dinero y que él te administre a ti.",
  "Invierte primero en tu conocimiento. Entender el dinero vale más que cualquier monto que puedas ahorrar hoy.",
  "No hay vergüenza en empezar de nuevo un mes. Lo importante es que sigas llevando tu registro con honestidad.",
  "La disciplina de hoy —anotar cada gasto— es el regalo que le haces a la persona que serás en cinco años.",
  "Deja que tu dinero se multiplique trabajando para ti, en vez de que tú trabajes solamente para conseguirlo.",
  "Una meta escrita, con fecha y número, deja de ser un deseo y se convierte en un plan.",
  "El control de tus gastos no te hace pobre, te hace libre. Cada 'no' a un gasto pequeño es un 'sí' a tu meta grande.",
  "No busques atajos hacia la riqueza; busca hábitos que se sostengan mes tras mes. Ahí está el verdadero atajo.",
  "Cuidar tus finanzas también es una forma de cuidarte a ti. Ahorrar es un acto de amor propio.",
  "El primer paso hacia la abundancia es simple: gasta menos de lo que ganas y anota la diferencia.",
  "Tu independencia financiera se construye con las decisiones pequeñas de cada día, no con un golpe de suerte.",
  "Revisa tus números con cariño, no con miedo. Este libro es tu aliado, no tu juez.",
  "Cada categoría de tu presupuesto es una promesa que te haces a ti misma. Cúmplela con paciencia.",
  "El dinero sigue a quienes lo entienden. Aprender a leer tus propias finanzas es un acto de poder.",
  "No compares tu camino financiero con el de nadie más. Tu ritmo, tus metas, tu historia.",
  "Ahorrar no es dejar de vivir, es asegurarte de poder seguir viviendo bien mañana también."
];

function randomWisdom(){
  return WISDOM[Math.floor(Math.random()*WISDOM.length)];
}

// Datos importados de tu archivo de Excel (Finanzas_Personales_Sury), para que la
// app arranque ya con tu historial real en vez de vacía. Solo se cargan la
// primera vez que abres la app en un navegador nuevo (si ya tienes datos
// guardados, esto no los reemplaza).
const SEED_TRANSACTIONS = [];

// Servicios que se repiten mes a mes en tu historial (internet, energía, agua,
// gas, plan de celular) y tu ahorro mensual, detectados automáticamente.
const SEED_RECURRENTES = [];

let state = {
  transactions: [],   // {id, fecha:'YYYY-MM-DD', tipo:'Ingreso'|'Egreso', categoria, concepto, monto}
  budgets: {},         // {categoria: monto mensual}
  goals: [],           // {id, nombre, objetivo, actual}
  categories: DEFAULT_CATS.slice(),
  recurrentes: [],     // {id, tipo, categoria, concepto, monto, dia, pagadoEn:{monthKey:true}}
  recurAppliedMonths: [], // ['2026-07', ...] months where recurring items were already inserted
  cards: [],           // {id, nombre, cupo, diaPago, movimientos:[{id,fecha,tipo:'Cargo'|'Pago',concepto,monto}]}
  tramites: [],        // {id, nombre, monto, fecha:'YYYY-MM-DD', link, categoria}
  prestamoCarro: null, // {total, pagos:[{id,fecha,valor,obs}]}
  cierresMes: {},      // {'2026-08': {pasos:[bool,...], saldoDeclarado:number, fecha:'YYYY-MM-DD'}}
  saldoInicial: 0,     // tu efectivo + cuentas reales al momento de empezar a usar la app
  saldoInicialFecha: null, // 'YYYY-MM-DD' desde cuándo aplica ese saldo inicial
  notes: {},           // {'2026-07': 'texto de la reflexión'}
  theme: 'light',
  colorTheme: 'floral',   // 'floral' | 'tierra' | 'oceano'
  pin: null,           // '1234' o null si no hay bloqueo
  pinPregunta: '',     // pregunta de seguridad para recuperar el PIN
  pinRespuesta: '',    // respuesta esperada (comparación simple, no cifrada)
  tutorialSeen: false
};

let currentMonthIndex; // 0-11 within currentYear
let currentYear;
let activeTab = 'dashboard';
let typeSelected = 'Egreso';
let charts = {};
let currentWisdom = randomWisdom();
let comparativoYear = null;
let notifiedThisSession = false;

const todayObj = new Date();
currentYear = todayObj.getFullYear();
currentMonthIndex = todayObj.getMonth();

function uid(){ return 'id' + Date.now() + Math.random().toString(36).slice(2,8); }

function applyBodyTheme(){
  const classes = [];
  if(state.colorTheme && state.colorTheme!=='floral') classes.push('theme-'+state.colorTheme);
  if(state.theme==='dark') classes.push('dark');
  document.body.className = classes.join(' ');
}

// Capa de almacenamiento: usa el guardado de Claude cuando la app corre dentro de Claude,
// y usa localStorage del navegador cuando el archivo se abre directamente (compartido por
// fuera de Claude). Así el mismo archivo .html funciona en ambos casos, y cada persona que
// lo abra en su propio computador guarda sus propios datos y categorías, sin mezclarse.
const storageShim = {
  async get(key, shared){
    if(window.storage) return window.storage.get(key, shared);
    const val = localStorage.getItem(key);
    if(val===null) throw new Error('not found');
    return {key, value:val, shared};
  },
  async set(key, value, shared){
    if(window.storage) return window.storage.set(key, value, shared);
    localStorage.setItem(key, value);
    return {key, value, shared};
  }
};

async function loadState(){
  let hadSavedData = false;
  try{
    let parsed = null;
    if(currentUser){
      parsed = await cloudStore.get();
    }
    if(!parsed){
      const r = await storageShim.get('finanzas_data', false);
      if(r && r.value) parsed = JSON.parse(r.value);
    }
    if(parsed){
      hadSavedData = true;
      state = Object.assign(state, parsed);
      if(!state.categories || !state.categories.length) state.categories = DEFAULT_CATS.slice();
      if(!state.recurrentes) state.recurrentes = [];
      if(!state.recurAppliedMonths) state.recurAppliedMonths = [];
      if(!state.cards) state.cards = [];
      state.recurrentes.forEach(rec=>{ if(!rec.pagadoEn) rec.pagadoEn = {}; });
      if(!state.notes) state.notes = {};
      if(!state.theme) state.theme = 'light';
      if(!state.colorTheme) state.colorTheme = 'floral';
      if(state.pin===undefined) state.pin = null;
      if(state.pinPregunta===undefined) state.pinPregunta = '';

      if(!state.tramites) state.tramites = [];

        state.prestamoCarro = { total: 0, pagos: [] };
      }
      if(!state.categories.includes('Deuda Carro')) state.categories.push('Deuda Carro');
      if(state.saldoInicial===undefined) state.saldoInicial = 0;
      if(state.saldoInicialFecha===undefined) state.saldoInicialFecha = null;
      if(!state.cierresMes) state.cierresMes = {};
      // Enlaces oficiales de pago para tus servicios públicos (Serviciudad=agua,

      });
    }
  }catch(e){
    console.log('No previous data found, starting fresh.', e);
  }

  if(!hadSavedData){
    // Primera vez que se abre en este navegador: precargamos tu historial real
    // importado del Excel y los servicios recurrentes detectados.
    state.transactions = SEED_TRANSACTIONS.map(t=>({ id:uid(), ...t }));
    state.recurrentes = SEED_RECURRENTES.map(r=>({ id:uid(), pagadoEn:{}, ...r }));
    saveState();
    // Mostramos el mes más reciente que tenga movimientos, en vez del mes real
    // actual (que estaría vacío).
    const lastFecha = state.transactions.map(t=>t.fecha).sort().slice(-1)[0];
    if(lastFecha){
      const d = new Date(lastFecha+'T00:00:00');
      currentMonthIndex = d.getMonth();
      currentYear = d.getFullYear();
    }
  }

  applyBodyTheme();

  if(currentUser) saveState(); // asegura que la nube quede con la versión más reciente/migrada

  if(state.pin){
    renderLockScreen();
  } else {
    render();

  }

}

/* ---------------- Derived data ---------------- */
function monthKey(y,m){ return y + '-' + String(m+1).padStart(2,'0'); }
function txMonthKey(tx){ const d = new Date(tx.fecha+'T00:00:00'); return monthKey(d.getFullYear(), d.getMonth()); }

function txForCurrentMonth(){
  const key = monthKey(currentYear, currentMonthIndex);
  return state.transactions.filter(t => txMonthKey(t) === key);
}

function totalsFor(list){
  let ingresos=0, egresos=0;
  list.forEach(t=>{
    if(t.tipo==='Ingreso') ingresos += Number(t.monto)||0;
    else egresos += Number(t.monto)||0;
  });
  return {ingresos, egresos, balance: ingresos-egresos};
}

// Saldo real acumulado: tu saldo inicial (efectivo + cuentas) más todo lo que ha
// entrado y salido hasta el final del mes que estás viendo — no solo ese mes.
function cumulativeBalance(uptoYear, uptoMonthIndex){
  const endOfMonth = new Date(uptoYear, uptoMonthIndex+1, 0);
  let saldo = Number(state.saldoInicial)||0;
  const desde = state.saldoInicialFecha ? new Date(state.saldoInicialFecha+'T00:00:00') : null;
  state.transactions.forEach(t=>{
    const d = new Date(t.fecha+'T00:00:00');
    if(d>endOfMonth) return;
    if(desde && d<desde) return; // no contar movimientos anteriores a la fecha del saldo inicial
    saldo += (t.tipo==='Ingreso' ? 1 : -1) * (Number(t.monto)||0);
  });
  return saldo;
}

function categoryBreakdown(list, tipo){
  const map = {};
  list.filter(t=>t.tipo===tipo).forEach(t=>{
    map[t.categoria] = (map[t.categoria]||0) + (Number(t.monto)||0);
  });
  return map;
}

function last6MonthsData(){
  const out = [];
  for(let i=5;i>=0;i--){
    let m = currentMonthIndex - i, y = currentYear;
    while(m<0){ m+=12; y-=1; }
    const key = monthKey(y,m);
    const list = state.transactions.filter(t=>txMonthKey(t)===key);
    const tot = totalsFor(list);
    out.push({label: MESES[m].slice(0,3)+" '"+String(y).slice(2), ...tot});
  }
  return out;
}

function prevMonthTotals(){
  let m = currentMonthIndex-1, y = currentYear;
  if(m<0){ m=11; y-=1; }
  const key = monthKey(y,m);
  const list = state.transactions.filter(t=>txMonthKey(t)===key);
  return totalsFor(list);
}

function topCategory(list){
  const map = categoryBreakdown(list,'Egreso');
  let best=null, bestVal=0;
  Object.entries(map).forEach(([cat,val])=>{ if(val>bestVal){ best=cat; bestVal=val; } });
  return best ? {categoria:best, monto:bestVal} : null;
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

function dailyAvgAndProjection(list){
  const totalDays = daysInMonth(currentYear, currentMonthIndex);
  const isCurrentRealMonth = (currentYear===todayObj.getFullYear() && currentMonthIndex===todayObj.getMonth());
  const isFuture = new Date(currentYear, currentMonthIndex, 1) > new Date(todayObj.getFullYear(), todayObj.getMonth(), 1);
  const elapsed = isCurrentRealMonth ? todayObj.getDate() : totalDays;
  const egresos = totalsFor(list).egresos;
  if(isFuture || elapsed===0) return null;
  const avg = egresos/elapsed;
  const projected = avg*totalDays;
  return { avg, projected, totalDays, elapsed, isCurrentRealMonth };
}

function calendarSpendMap(list){
  const map = {};
  list.filter(t=>t.tipo==='Egreso').forEach(t=>{
    const day = Number(t.fecha.slice(8,10));
    map[day] = (map[day]||0) + (Number(t.monto)||0);
  });
  return map;
}

function anthillExpenses(list, threshold=30000){
  const map = {};
  list.filter(t=>t.tipo==='Egreso' && (Number(t.monto)||0) < threshold).forEach(t=>{
    const key = (t.concepto || t.categoria).toLowerCase().trim();
    if(!map[key]) map[key] = { count:0, total:0 };
    map[key].count++;
    map[key].total += Number(t.monto)||0;
  });
  let total=0, count=0;
  Object.values(map).forEach(m=>{ if(m.count>=2){ total+=m.total; count+=m.count; } });
  return { total, count };
}

function goalProjection(g){
  if(!g.historial || g.historial.length===0) return null;
  const remaining = g.objetivo - g.actual;
  if(remaining<=0) return { done:true };
  const byMonth = {};
  g.historial.forEach(h=>{ const k=h.fecha.slice(0,7); byMonth[k]=(byMonth[k]||0)+h.monto; });
  const months = Object.keys(byMonth);
  const avgPerMonth = Object.values(byMonth).reduce((a,b)=>a+b,0) / months.length;
  if(avgPerMonth<=0) return null;
  const monthsNeeded = Math.ceil(remaining/avgPerMonth);
  return { monthsNeeded, avgPerMonth };
}

function cardBalance(card){
  let cargos=0, pagos=0;
  card.movimientos.forEach(m=>{
    if(m.tipo==='Cargo') cargos += Number(m.monto)||0; else pagos += Number(m.monto)||0;
  });
  return cargos-pagos;
}

// Avisos de pago: recibos/recurrentes próximos a vencer o vencidos, basados en la fecha real de hoy
function getBillAlerts(){
  const now = todayObj;
  const alerts = [];
  state.recurrentes.forEach(r=>{
    const dim = daysInMonth(now.getFullYear(), now.getMonth());
    const dia = Math.min(Number(r.dia)||1, dim);
    const mKey = monthKey(now.getFullYear(), now.getMonth());
    if((r.pagadoEn||{})[mKey]) return;
    const dueDate = new Date(now.getFullYear(), now.getMonth(), dia);
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffDays = Math.round((dueDate-todayMid)/(1000*60*60*24));
    alerts.push({ kind:'bill', id:r.id, nombre:r.concepto || r.categoria, monto:r.monto, diffDays, mKey, link:r.link, cuenta:r.cuenta });
  });
  return alerts;
}

// Avisos de pago de tarjetas de crédito, según el día de pago configurado
function getCardAlerts(){
  const now = todayObj;
  const alerts = [];
  state.cards.forEach(c=>{
    if(!c.diaPago) return;
    const saldo = cardBalance(c);
    if(saldo<=0) return;
    const dim = daysInMonth(now.getFullYear(), now.getMonth());
    const dia = Math.min(Number(c.diaPago)||1, dim);
    let dueDate = new Date(now.getFullYear(), now.getMonth(), dia);
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let diffDays = Math.round((dueDate-todayMid)/(1000*60*60*24));
    alerts.push({ kind:'card', id:c.id, nombre:'Tarjeta '+c.nombre, monto:saldo, diffDays });
  });
  return alerts;
}

// Avisos de trámites del carro (SOAT, revisión técnico-mecánica, impuesto...) próximos a vencer,
// con una ventana más amplia (30 días) ya que suelen ser anuales, no mensuales.
function getTramiteAlerts(){
  return state.tramites.map(t=>{
    const diffDays = tramiteDiffDays(t);
    return { kind:'tramite', id:t.id, nombre:t.nombre, monto:t.monto, diffDays, link:t.link };
  }).filter(a=> a.diffDays<=30);
}

function alertUrgencyClass(diffDays){
  if(diffDays<0) return 'overdue';
  if(diffDays<=3) return 'soon';
  return 'later';
}
function alertWhenLabel(diffDays){
  if(diffDays<0) return `Vencido hace ${Math.abs(diffDays)} día${Math.abs(diffDays)!==1?'s':''}`;
  if(diffDays===0) return 'Vence hoy';
  if(diffDays===1) return 'Vence mañana';
  return `Vence en ${diffDays} días`;
}

      diffEl.innerHTML = `<span class="cierre-diff-ok">✓ Cuadra perfecto</span>`;
    } else {
      diffEl.innerHTML = `<span class="cierre-diff-bad">Diferencia de ${fmt(Math.abs(diff))} ${diff>0 ? '(te falta registrar un gasto o tienes menos de lo que dice la app)' : '(te falta registrar un ingreso o tienes más de lo que dice la app)'}</span>`;
    }
  }
  diffInput.addEventListener('input', ()=>{
    updateDiff();
    cierre.saldoDeclarado = parseFloat(diffInput.value) || null;
    saveState();
  });
  updateDiff();
}

function loadSeedData(){
  let addedTx = 0, addedRec = 0;
  SEED_TRANSACTIONS.forEach(tx=>{
    const dup = state.transactions.some(t=> t.fecha===tx.fecha && t.categoria===tx.categoria && t.concepto===tx.concepto && Number(t.monto)===Number(tx.monto) && t.tipo===tx.tipo);
    if(!dup){ state.transactions.push({ id:uid(), ...tx }); addedTx++; }
  });
  SEED_RECURRENTES.forEach(rec=>{
    const dup = state.recurrentes.some(r=> r.categoria===rec.categoria && r.concepto===rec.concepto);
    if(!dup){ state.recurrentes.push({ id:uid(), pagadoEn:{}, ...rec }); addedRec++; }
  });
  saveState();
  const lastFecha = state.transactions.map(t=>t.fecha).sort().slice(-1)[0];
  if(lastFecha){
    const d = new Date(lastFecha+'T00:00:00');
    currentMonthIndex = d.getMonth();
    currentYear = d.getFullYear();
  }
  showToast(`$ Se agregaron ${addedTx} movimientos y ${addedRec} recurrentes`);
  activeTab = 'dashboard';
  render();
}

function budgetStreak(cat){
  // Cuenta meses consecutivos (terminando en el mes actualmente visto) en los que el gasto real
  // de la categoría estuvo dentro del presupuesto definido.
  const ppto = state.budgets[cat];
  if(!ppto || ppto<=0) return 0;
  let streak=0;
  for(let i=0;i<24;i++){
    let m = currentMonthIndex - i, y = currentYear;
    while(m<0){ m+=12; y-=1; }
    const key = monthKey(y,m);
    const list = state.transactions.filter(t=>txMonthKey(t)===key);
    const real = categoryBreakdown(list,'Egreso')[cat] || 0;
    const hasAnyData = state.transactions.some(t=>txMonthKey(t)===key);
    if(!hasAnyData) break; // no seguimos contando meses sin registros
    if(real<=ppto) streak++; else break;
  }
  return streak;
}

function shiftMonth(delta){
  currentMonthIndex += delta;
  while(currentMonthIndex<0){ currentMonthIndex+=12; currentYear-=1; }
  while(currentMonthIndex>11){ currentMonthIndex-=12; currentYear+=1; }
  render();
}

          <input type="text" id="f-concepto" placeholder="Ej. Mercado, Sueldo, Gasolina...">
        </div>
        <div class="field">
          <label>Monto (COP)</label>
          <input type="number" id="f-monto" placeholder="0" min="0">
        </div>
      </div>
      <div style="margin-top:14px; text-align:right;">
        <button class="btn-add" id="addTxBtn">Agregar movimiento</button>
      </div>
    </div>

    ${state.recurrentes.length ? `<p style="font-size:12px; color:var(--ink-soft); margin:0 0 16px;">💡 Tus gastos recurrentes solo se agregan aquí cuando los marcas como pagados desde el Resumen — así nunca se suman antes de tiempo.</p>` : ''}

    <div class="section-title">Movimientos de ${MESES[currentMonthIndex]}</div>
    <div class="filter-bar">
      <input type="text" id="searchTx" placeholder="Buscar por concepto...">
      <select id="filterCat"><option value="">Todas las categorías</option>${filterCatOptions}</select>
    </div>
    <div id="txListWrap"></div>
  `;

  let editingTxId = null;
  function drawList(){
    const q = (document.getElementById('searchTx').value || '').toLowerCase();
    const fc = document.getElementById('filterCat').value;
    const list = allList.filter(t=>{
      const matchesQ = !q || (t.concepto||'').toLowerCase().includes(q) || t.categoria.toLowerCase().includes(q);
      const matchesCat = !fc || t.categoria===fc;
      return matchesQ && matchesCat;
    });
    const wrap = document.getElementById('txListWrap');
    const catOptionsEdit = state.categories.map(c=>`<option value="${c}">${c}</option>`).join('');
    wrap.innerHTML = list.length ? `
    <table class="ledger-table">
      <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Concepto</th><th style="text-align:right;">Monto</th><th></th></tr></thead>
      <tbody>
        ${list.map(t=>{
          if(t.id===editingTxId){
            return `
            <tr>
              <td><input type="date" id="edit-fecha-${t.id}" value="${t.fecha}" style="width:130px; padding:4px 6px; border:1px solid var(--line); border-radius:6px;"></td>
              <td>
                <select id="edit-tipo-${t.id}" style="padding:4px 6px; border:1px solid var(--line); border-radius:6px;">
                  <option value="Ingreso" ${t.tipo==='Ingreso'?'selected':''}>Ingreso</option>
                  <option value="Egreso" ${t.tipo==='Egreso'?'selected':''}>Egreso</option>
                </select>
              </td>
              <td><select id="edit-categoria-${t.id}" style="padding:4px 6px; border:1px solid var(--line); border-radius:6px;">${catOptionsEdit.replace(`value="${t.categoria}"`, `value="${t.categoria}" selected`)}</select></td>
              <td><input type="text" id="edit-concepto-${t.id}" value="${t.concepto||''}" style="width:100%; padding:4px 6px; border:1px solid var(--line); border-radius:6px;"></td>
              <td><input type="number" id="edit-monto-${t.id}" value="${t.monto}" style="width:110px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; text-align:right;"></td>
              <td style="white-space:nowrap;">
                <button class="del-btn" style="color:var(--income);" data-save-id="${t.id}" title="Guardar">✓</button>
                <button class="del-btn" data-cancel-id="${t.id}" title="Cancelar">✕</button>
              </td>
            </tr>`;
          }
          return `
          <tr>
            <td>${t.fecha}</td>
            <td><span class="tag ${t.tipo}">${t.tipo}</span></td>
            <td>${t.categoria}</td>
            <td>${t.concepto||'—'}</td>
            <td class="amount-mono" style="color:${t.tipo==='Ingreso'?'var(--income)':'var(--expense)'}">${t.tipo==='Ingreso'?'+':'−'} ${fmt(t.monto)}</td>
            <td style="white-space:nowrap;">
              <button class="del-btn" data-edit-id="${t.id}" title="Editar">✏️</button>
              <button class="del-btn" data-id="${t.id}" title="Eliminar">✕</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>` : `<div class="empty-note" style="background:var(--card); border:1px solid var(--line); border-radius:10px;">${allList.length ? 'Ningún movimiento coincide con tu búsqueda.' : 'Aún no hay movimientos este mes. Agrega el primero arriba ↑'}</div>`;

    wrap.querySelectorAll('[data-edit-id]').forEach(b=>{
      b.onclick = ()=>{ editingTxId = b.dataset.editId; drawList(); };
    });
    wrap.querySelectorAll('[data-cancel-id]').forEach(b=>{
      b.onclick = ()=>{ editingTxId = null; drawList(); };
    });
    wrap.querySelectorAll('[data-save-id]').forEach(b=>{
      b.onclick = ()=>{
        const id = b.dataset.saveId;
        const t = state.transactions.find(x=>x.id===id);
        const fecha = document.getElementById('edit-fecha-'+id).value;
        const tipo = document.getElementById('edit-tipo-'+id).value;
        const categoria = document.getElementById('edit-categoria-'+id).value;
        const concepto = document.getElementById('edit-concepto-'+id).value.trim();
        const monto = parseFloat(document.getElementById('edit-monto-'+id).value);
        if(!fecha || !monto || monto<=0){ showToast('Revisa la fecha y el monto.'); return; }
        Object.assign(t, { fecha, tipo, categoria, concepto, monto });
        editingTxId = null;
        saveState();
        renderMovimientos();
        showToast('Movimiento actualizado ✓');
      };
    });

    wrap.querySelectorAll('.del-btn[data-id]').forEach(b=>{
      b.onclick = ()=>{
        if(confirm('¿Eliminar este movimiento?')){
          const deleted = state.transactions.find(t=>t.id===b.dataset.id);
          state.transactions = state.transactions.filter(t=>t.id!==b.dataset.id);
          saveState();
          renderMovimientos();
          showToast('Movimiento eliminado', 'Deshacer', ()=>{
            state.transactions.push(deleted);
            saveState();
            renderMovimientos();
          });
        }
      };
    });
  }
  drawList();
  document.getElementById('searchTx').addEventListener('input', drawList);
  document.getElementById('filterCat').addEventListener('change', drawList);



  panel.querySelectorAll('.type-toggle button').forEach(b=>{
    b.onclick = ()=>{ typeSelected = b.dataset.t; renderMovimientos(); };
  });

  document.getElementById('goManageCats').onclick = ()=>{
    activeTab = 'ajustes';
    render();
  };

  document.getElementById('f-categoria').onchange = (e)=>{
    if(e.target.value === '__new'){
      const nueva = prompt('Nombre de la nueva categoría:');
      if(nueva && nueva.trim()){
        state.categories.push(nueva.trim());
        saveState();
      }
      renderMovimientos();
    }
  };

  document.getElementById('addTxBtn').onclick = ()=>{
    const fecha = document.getElementById('f-fecha').value;
    const categoria = document.getElementById('f-categoria').value;
    const concepto = document.getElementById('f-concepto').value.trim();
    const monto = parseFloat(document.getElementById('f-monto').value);

    if(!fecha){ showToast('Selecciona una fecha.'); return; }
    const fechaObj = new Date(fecha+'T00:00:00');
    if(isNaN(fechaObj.getTime()) || fechaObj.getFullYear()<2000 || fechaObj.getFullYear()>todayObj.getFullYear()+5){
      showToast('Revisa la fecha, parece incorrecta.'); return;
    }
    if(!monto || monto<=0 || !isFinite(monto)){ showToast('Ingresa un monto válido.'); return; }
    if(categoria === '__new'){ showToast('Elige o crea una categoría.'); return; }
    if(monto > 500000000 && !confirm(`¿Confirmas un monto de ${fmt(monto)}? Parece muy alto, por si fue un error al escribir.`)){ return; }

    state.transactions.push({ id:uid(), fecha, tipo:typeSelected, categoria, concepto, monto });
    saveState();
    if(categoria === 'Ahorro'){
      showToast('$ Guardaste otra semilla para tu futuro. ¡Sigue así!');
    } else {
      showToast('Movimiento agregado ✓');
    }
    // jump view to the month of the new transaction if different
    const d = new Date(fecha+'T00:00:00');
    currentMonthIndex = d.getMonth(); currentYear = d.getFullYear();
    render();
  };
}

function applyRecurringForCurrentMonth(){
  const key = monthKey(currentYear, currentMonthIndex);
  if(state.recurAppliedMonths.includes(key)) return;
  const totalDays = daysInMonth(currentYear, currentMonthIndex);
  state.recurrentes.forEach(r=>{
    const day = Math.min(Number(r.dia)||1, totalDays);
    const fecha = `${currentYear}-${String(currentMonthIndex+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    state.transactions.push({ id:uid(), fecha, tipo:r.tipo, categoria:r.categoria, concepto:r.concepto, monto:r.monto });
  });
  state.recurAppliedMonths.push(key);
  saveState();
  showToast('$ Gastos recurrentes agregados a '+MESES[currentMonthIndex]);
  renderMovimientos();
}

/* ---------------- Presupuestos ---------------- */
function renderPresupuestos(){
  const panel = document.getElementById('panel-presupuestos');
  const list = txForCurrentMonth();
  const realByCat = categoryBreakdown(list, 'Egreso');
  const cats = state.categories.filter(c=>c!=='Sueldo'); // budgets mostly for expense-like categories, but allow all except Sueldo

  panel.innerHTML = `
    <div class="section-title" style="margin-top:0;">Presupuesto mensual por categoría</div>
    <div class="form-card">
      ${cats.map(cat=>{
        const ppto = state.budgets[cat] || 0;
        const real = realByCat[cat] || 0;
        const pct = ppto>0 ? Math.min(100, Math.round(real/ppto*100)) : (real>0?100:0);
        const over = ppto>0 && real>ppto;
        const streak = budgetStreak(cat);
        return `
        <div class="budget-row">
          <div class="budget-cat">${cat}${streak>=2 ? `<span class="streak-badge"> 🔥 ${streak} meses</span>` : ''}</div>
          <div>
            <input type="number" class="budget-input" data-cat="${cat}" value="${ppto||''}" placeholder="Presupuesto $">
          </div>
          <div>
            <div class="budget-bar-wrap"><div class="budget-bar ${over?'over':''}" style="width:${pct}%"></div></div>
          </div>
          <div class="budget-nums">${fmt(real)} ${ppto>0 ? '/ '+fmt(ppto) : ''} ${over?' · sobre presupuesto':''}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="empty-note" style="text-align:left; padding:0 4px;">Los presupuestos se aplican a todos los meses. La barra compara lo gastado este mes contra ese límite.</div>
  `;

  panel.querySelectorAll('.budget-input').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const val = parseFloat(inp.value) || 0;
      state.budgets[inp.dataset.cat] = val;
      saveState();
      renderPresupuestos();
    });
  });
}

/* ---------------- Metas de ahorro ---------------- */
function renderMetas(){
  const panel = document.getElementById('panel-metas');
  const completedCount = state.goals.filter(g=>g.objetivo>0 && g.actual>=g.objetivo).length;

  panel.innerHTML = `
    <div class="section-title" style="margin-top:0;">Metas de ahorro</div>
    ${completedCount>0 ? `<div class="achieve-banner">🏆 Has cumplido ${completedCount} meta${completedCount>1?'s':''} de ahorro. ¡Cada una es una prueba de tu constancia!</div>` : ''}
    ${state.goals.length ? state.goals.map(g=>{
      const pct = g.objetivo>0 ? Math.min(100, Math.round(g.actual/g.objetivo*100)) : 0;
      const done = g.objetivo>0 && g.actual>=g.objetivo;
      const proj = done ? null : goalProjection(g);
      return `
      <div class="goal-card ${done?'done':''}">
        <div class="goal-top">
          <div class="goal-name">${g.nombre}${done?'<span class="goal-badge">🏆 Cumplida</span>':''}</div>
          <div class="goal-pct">${pct}%</div>
        </div>
        <div class="goal-bar-wrap"><div class="goal-bar" style="width:${pct}%"></div></div>
        <div class="goal-nums">
          <span>${fmt(g.actual)} ahorrado</span>
          <span>Meta: ${fmt(g.objetivo)}</span>
        </div>
        ${proj ? `<div style="font-size:12px; color:var(--savings); margin-top:8px;">$ A tu ritmo actual (~${fmt(proj.avgPerMonth)}/mes), la cumples en ~${proj.monthsNeeded} mes${proj.monthsNeeded!==1?'es':''}.</div>` : ''}
        <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
          <input type="number" placeholder="Agregar monto" class="budget-input" style="max-width:160px;" id="add-${g.id}">
          <button class="btn-add" style="padding:7px 12px;" data-add="${g.id}">Abonar</button>
          <button class="goal-del" data-del="${g.id}">Eliminar meta</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty-note" style="background:var(--card); border:1px solid var(--line); border-radius:10px;">Aún no tienes metas de ahorro. Crea la primera abajo ↓</div>`}

    <div class="form-card">
      <div class="section-title" style="margin-top:0;">Nueva meta</div>
      <div class="add-goal-form">
        <div class="field"><label>Nombre</label><input type="text" id="g-nombre" placeholder="Ej. Vacaciones, Fondo de emergencia"></div>
        <div class="field"><label>Objetivo (COP)</label><input type="number" id="g-objetivo" placeholder="0" min="0"></div>
        <button class="btn-add" id="addGoalBtn">Crear meta</button>
      </div>
    </div>
  `;

  document.getElementById('addGoalBtn').onclick = ()=>{
    const nombre = document.getElementById('g-nombre').value.trim();
    const objetivo = parseFloat(document.getElementById('g-objetivo').value);
    if(!nombre){ showToast('Dale un nombre a tu meta.'); return; }
    if(!objetivo || objetivo<=0){ showToast('Ingresa un objetivo válido.'); return; }
    state.goals.push({ id:uid(), nombre, objetivo, actual:0, historial:[] });
    saveState();
    renderMetas();
    showToast('Meta creada ✓');
  };

  panel.querySelectorAll('[data-add]').forEach(b=>{
    b.onclick = ()=>{
      const input = document.getElementById('add-'+b.dataset.add);
      const val = parseFloat(input.value);
      if(!val || val<=0){ showToast('Ingresa un monto válido.'); return; }
      const goal = state.goals.find(g=>g.id===b.dataset.add);
      if(!goal.historial) goal.historial = [];
      goal.historial.push({ fecha: new Date().toISOString().slice(0,10), monto: val });
      goal.actual += val;
      saveState();
      renderMetas();
      const pct = goal.objetivo>0 ? Math.round(goal.actual/goal.objetivo*100) : 0;
      if(pct>=100) showToast('✨ ¡Meta cumplida! "'+goal.nombre+'" ya es tuya.');
      else if(pct>=75) showToast('$ Ya casi llegas a "'+goal.nombre+'" — falta poquito.');
      else showToast('$ Un paso más cerca de "'+goal.nombre+'". Así se construye la libertad.');
    };
  });

  panel.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('¿Eliminar esta meta?')){
        state.goals = state.goals.filter(g=>g.id!==b.dataset.del);
        saveState();
        renderMetas();
      }
    };
  });
}

/* ---------------- Tarjeta de crédito ---------------- */

        <input type="text" placeholder="🔍 Buscar por concepto o fecha..." value="${cardSearchTerms[c.id]||''}" data-cc-search="${c.id}" style="width:100%; padding:8px 12px; border:1px solid var(--line); border-radius:20px; background:var(--paper-dark); font-size:13px; margin-bottom:10px;">

      if(tipo==='Pago'){
        if(!state.categories.includes('Tarjeta de crédito')) state.categories.push('Tarjeta de crédito');
        state.transactions.push({ id:uid(), fecha, tipo:'Egreso', categoria:'Tarjeta de crédito', concepto:concepto || ('Pago tarjeta '+card.nombre), monto });

      saveState();
      renderTarjeta();
      showToast(tipo==='Pago' ? '$ Pago registrado y agregado a tus movimientos' : 'Cargo agregado ✓');
    };
  });

  panel.querySelectorAll('[data-cc-mov-edit]').forEach(b=>{
    b.onclick = ()=>{ editingCardMovId = b.dataset.ccMovEdit; renderTarjeta(); };
  });
  panel.querySelectorAll('[data-cc-canceledit]').forEach(b=>{
    b.onclick = ()=>{ editingCardMovId = null; renderTarjeta(); };
  });
  panel.querySelectorAll('[data-cc-save]').forEach(b=>{
    b.onclick = ()=>{
      const [cardId, movId] = b.dataset.ccSave.split('|');
      const card = state.cards.find(c=>c.id===cardId);
      const m = card.movimientos.find(x=>x.id===movId);
      const fecha = document.getElementById('edit-cc-fecha-'+movId).value;
      const monto = parseFloat(document.getElementById('edit-cc-monto-'+movId).value);
      const concepto = document.getElementById('edit-cc-concepto-'+movId).value.trim();
      if(!fecha || !monto || monto<=0){ showToast('Revisa la fecha y el monto.'); return; }
      Object.assign(m, { fecha, monto, concepto });
      editingCardMovId = null;
      saveState();
      renderTarjeta();
      showToast('Movimiento de tarjeta actualizado ✓');
    };
  });

  panel.querySelectorAll('[data-cc-mov-del]').forEach(b=>{
    b.onclick = ()=>{
      const [cardId, movId] = b.dataset.ccMovDel.split('|');
      const card = state.cards.find(c=>c.id===cardId);
      card.movimientos = card.movimientos.filter(m=>m.id!==movId);
      saveState();
      renderTarjeta();
    };
  });

  panel.querySelectorAll('[data-cc-del-card]').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('¿Eliminar esta tarjeta y todo su historial?')){
        state.cards = state.cards.filter(c=>c.id!==b.dataset.ccDelCard);
        saveState();
        renderTarjeta();
      }
    };
  });
}

/* ---------------- Comparativo anual ---------------- */
function renderComparativo(){
  const panel = document.getElementById('panel-comparativo');

  const years = [...new Set(state.transactions.map(t=>t.fecha.slice(0,4)))].sort();
  if(!years.length) years.push(String(currentYear));
  if(!comparativoYear || !years.includes(comparativoYear)) comparativoYear = years[years.length-1];

  const yearTx = state.transactions.filter(t=>t.fecha.slice(0,4)===comparativoYear);
  const MESES_ABBR = MESES.map(m=>m.slice(0,3));

  function buildMatrix(tipo){
    const cats = [...new Set(yearTx.filter(t=>t.tipo===tipo).map(t=>t.categoria))].sort();
    const matrix = {};
    cats.forEach(c=>{ matrix[c] = new Array(12).fill(0); });
    yearTx.filter(t=>t.tipo===tipo).forEach(t=>{
      const m = Number(t.fecha.slice(5,7))-1;
      matrix[t.categoria][m] += Number(t.monto)||0;
    });
    return { cats, matrix };
  }

  function renderTable(tipo, titulo){
    const { cats, matrix } = buildMatrix(tipo);
    if(!cats.length) return `<div class="empty-note" style="background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:24px;">Sin ${tipo==='Ingreso'?'ingresos':'egresos'} registrados en ${comparativoYear}.</div>`;
    const monthTotals = new Array(12).fill(0);
    let grandTotal = 0;
    cats.forEach(c=> matrix[c].forEach((v,i)=>{ monthTotals[i]+=v; grandTotal+=v; }));

    return `
    <div class="compare-scroll">
      <table class="compare-table">
        <thead>
          <tr>
            <th>${titulo}</th>
            ${MESES_ABBR.map(m=>`<th>${m}</th>`).join('')}
            <th class="total-col">Total año</th>
          </tr>
        </thead>
        <tbody>
          ${cats.map(c=>{
            const rowTotal = matrix[c].reduce((a,b)=>a+b,0);
            return `<tr>
              <td>${c}</td>
              ${matrix[c].map(v=>`<td class="amt-mono ${v===0?'zero':''}">${v===0?'—':fmt(v)}</td>`).join('')}
              <td class="amt-mono total-col">${fmt(rowTotal)}</td>
            </tr>`;
          }).join('')}
          <tr class="total-row">
            <td>Total</td>
            ${monthTotals.map(v=>`<td class="amt-mono">${v===0?'—':fmt(v)}</td>`).join('')}
            <td class="amt-mono total-col">${fmt(grandTotal)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  const totalIngresos = yearTx.filter(t=>t.tipo==='Ingreso').reduce((a,t)=>a+(Number(t.monto)||0),0);
  const totalEgresos = yearTx.filter(t=>t.tipo==='Egreso').reduce((a,t)=>a+(Number(t.monto)||0),0);
  const totalAhorro = yearTx.filter(t=>t.tipo==='Egreso' && t.categoria==='Ahorro').reduce((a,t)=>a+(Number(t.monto)||0),0);
  const balanceAnual = totalIngresos-totalEgresos;

  panel.innerHTML = `
    <div class="year-picker">
      <span class="section-title" style="margin:0;">Comparativo mensual</span>
      <select id="compareYearSelect">${years.map(y=>`<option value="${y}" ${y===comparativoYear?'selected':''}>${y}</option>`).join('')}</select>
      <button class="btn-add" id="exportCompareBtn" style="margin-left:auto;">⬇ Descargar Excel</button>
      <button class="mark-paid-btn" id="printCompareBtn" style="border-color:var(--ink); color:var(--ink);">🖨 Imprimir / PDF</button>
    </div>

    <div class="section-title">Ingresos por categoría</div>
    ${renderTable('Ingreso', 'Categoría')}

    <div class="section-title">Egresos por categoría</div>
    ${renderTable('Egreso', 'Categoría')}

    <div class="section-title">Cierre del año ${comparativoYear}</div>
    <div class="closing-card">
      <div class="closing-title">"El año se cierra no por lo que ganaste, sino por lo que decidiste guardar."</div>
      <div class="closing-grid">
        <div class="closing-item"><div class="cl-label">Ingresos totales</div><div class="cl-val" style="color:var(--income);">${fmt(totalIngresos)}</div></div>
        <div class="closing-item"><div class="cl-label">Egresos totales</div><div class="cl-val" style="color:var(--expense);">${fmt(totalEgresos)}</div></div>
        <div class="closing-item"><div class="cl-label">Balance del año</div><div class="cl-val">${fmt(balanceAnual)}</div></div>
        <div class="closing-item"><div class="cl-label">Total ahorrado</div><div class="cl-val" style="color:var(--savings);">${fmt(totalAhorro)}</div></div>
      </div>
    </div>
  `;

  document.getElementById('compareYearSelect').addEventListener('change', (e)=>{
    comparativoYear = e.target.value;
    renderComparativo();
  });

  document.getElementById('printCompareBtn').onclick = ()=>{ window.print(); };

  document.getElementById('exportCompareBtn').onclick = ()=>{
    function sheetFromMatrix(tipo){
      const { cats, matrix } = buildMatrix(tipo);
      const header = ['Categoría', ...MESES_ABBR, 'Total año'];
      const rows = cats.map(c=>{
        const vals = matrix[c];
        return [c, ...vals, vals.reduce((a,b)=>a+b,0)];
      });
      const monthTotals = new Array(12).fill(0);
      cats.forEach(c=> matrix[c].forEach((v,i)=> monthTotals[i]+=v));
      rows.push(['Total', ...monthTotals, monthTotals.reduce((a,b)=>a+b,0)]);
      return [header, ...rows];
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheetFromMatrix('Ingreso')), 'Ingresos');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheetFromMatrix('Egreso')), 'Egresos');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
      ['Cierre del año', comparativoYear],
      ['Ingresos totales', totalIngresos],
      ['Egresos totales', totalEgresos],
      ['Balance del año', balanceAnual],
      ['Total ahorrado', totalAhorro]
    ]), 'Cierre');
    XLSX.writeFile(wb, `comparativo-${comparativoYear}.xlsx`);
    showToast('Excel descargado ✓');
  };
}

/* ---------------- Mi Carro (trámites y matrículas) ---------------- */
function tramiteDiffDays(t){
  const due = new Date(t.fecha+'T00:00:00');
  const today = new Date(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate());
  return Math.round((due-today)/(1000*60*60*24));
}
function tramiteUrgency(diff){
  if(diff<0) return 'overdue';
  if(diff<=15) return 'soon';
  return 'later';
}
function tramiteWhenLabel(diff){
  if(diff<0) return `Vencido hace ${Math.abs(diff)} día${Math.abs(diff)!==1?'s':''}`;
  if(diff===0) return 'Vence hoy';
  if(diff===1) return 'Vence mañana';
  return `Vence en ${diff} días`;
}

function renderCarro(){
  const panel = document.getElementById('panel-carro');
  const sorted = state.tramites.slice().sort((a,b)=> tramiteDiffDays(a)-tramiteDiffDays(b));
  const catOptions = state.categories.map(c=>`<option value="${c}">${c}</option>`).join('');

  const loan = state.prestamoCarro;
  const pagosOrdenados = loan ? loan.pagos.slice().sort((a,b)=> a.fecha.localeCompare(b.fecha)) : [];
  const totalPagado = loan ? loan.pagos.reduce((a,p)=>a+(Number(p.valor)||0),0) : 0;
  const saldoRestante = loan ? loan.total - totalPagado : 0;
  const pctPagado = loan && loan.total>0 ? Math.min(100, Math.round(totalPagado/loan.total*100)) : 0;

  panel.innerHTML = `
    <div class="section-title" style="margin-top:0;">Préstamo del carro</div>
    <div class="loan-card">
      <div class="loan-top">
        <div class="loan-stat"><div class="ls-label">Deuda total</div><div class="ls-val">
          <input type="number" id="loan-total" value="${loan?loan.total:0}" style="width:140px; border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-family:'Space Mono'; background:var(--card);">
        </div></div>
        <div class="loan-stat"><div class="ls-label">Pagado hasta ahora</div><div class="ls-val" style="color:var(--income);">${fmt(totalPagado)}</div></div>
        <div class="loan-stat"><div class="ls-label">Saldo restante</div><div class="ls-val" style="color:var(--expense);">${fmt(saldoRestante)}</div></div>
      </div>
      <div class="loan-bar-wrap"><div class="loan-bar" style="width:${pctPagado}%"></div></div>
      <div style="font-size:12px; color:var(--ink-soft); text-align:right;">${pctPagado}% pagado</div>

      <table class="loan-pagos-table">
        <thead><tr><th>Fecha</th><th>Valor</th><th>Observaciones</th><th></th></tr></thead>
        <tbody>
          ${pagosOrdenados.map(p=>`
            <tr>
              <td>${p.fecha}</td>
              <td class="amount-mono">${fmt(p.valor)}</td>
              <td>${p.obs||'—'}</td>
              <td><button class="del-btn" data-loanpago-del="${p.id}" title="Eliminar">✕</button></td>
            </tr>
          `).join('')}
